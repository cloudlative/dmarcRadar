<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a86e0"/>
      <stop offset="1" stop-color="#17a878"/>
    </linearGradient>
    <radialGradient id="sweep" cx="64" cy="64" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- SMIL animation (not CSS) so the rotation survives being embedded standalone, e.g. via
       an <img> tag in the GitHub README, where our app's stylesheet isn't loaded. -->
  <path d="M64 64 L64 15 A49 49 0 0 1 104.4 37.7 Z" fill="url(#sweep)">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 64 64"
      to="360 64 64"
      dur="3.5s"
      repeatCount="indefinite"/>
  </path>

  <circle cx="64" cy="64" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="64" cy="64" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="64" y1="13" x2="64" y2="115" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <line x1="13" y1="64" x2="115" y2="64" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Envelope at the radar's center, standing in for the plain blip dot -->
  <rect x="51" y="56" width="26" height="18" rx="2.5" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M52 58 L64 69 L76 58" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Detected signal: a verified tick instead of a plain dot -->
  <circle cx="87" cy="45" r="11" fill="none" stroke="#ff7a45" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="87" cy="45" r="8" fill="#ff7a45"/>
  <path d="M83 45 L86 48 L92 41" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
