services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    # Overrides the .env DATABASE_URL (which points at `localhost`, correct for running the
    # app outside Docker) with one that points at the `postgres` service by name, built from
    # the same POSTGRES_USER/PASSWORD/DB credentials — so there's one source of truth for the
    # DB password, not two copies that can drift out of sync.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    ports:
      - "3000:3000"
    volumes:
      - reports_storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "worker/poller.ts"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      - reports_storage:/app/storage

volumes:
  postgres_data:
  reports_storage:
